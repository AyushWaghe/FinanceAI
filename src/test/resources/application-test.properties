server.port=8081

#DB settings-------------------------------------------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.ai.openai.api-key=${OPEN_AI_API_KEY}

qdrant.url=${QDRANT_URL}
qdrant.api-key=${QDRANT_API_KEY}
qdrant.host=${QDRANT_HOST}
qdrant.port=6334
spring.ai.openai.embedding.options.model=text-embedding-3-small

storage.bucket-name=finance-ai-ncdc
storage.endpoint=https://s3.us-east-005.backblazeb2.com
storage.region=us-east-005
storage.access-key=${S3_API_KEY_ID}
storage.secret-key=${S3_API_KEY}

#Producer configuration---------------------------------------------------------------------------------------------------
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer


#Consumer configuration------------------------------------------------------------------------------------------------------

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

#KAFKA SETTINGS
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

#Actuator metrics-----------------------------------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,metrics


#JINA SETTINGS ------------------------------------------------------------------------------------------------------------------
jina.api-key=${JINA_API_KEY}
jina.url=https://api.jina.ai/v1/rerank
jina.model=jina-reranker-v2-base-multilingual



